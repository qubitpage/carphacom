<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Carphacom Vultr Marketplace Gallery</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #eef3f8; color: #102033; }
    main { max-width: 1120px; margin: 0 auto; padding: 40px 24px 80px; }
    h1 { margin: 0 0 10px; font-size: 34px; letter-spacing: -0.03em; }
    p.lead { margin: 0 0 32px; color: #4a5e76; font-size: 17px; line-height: 1.55; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 24px; }
    figure { margin: 0; padding: 14px; border-radius: 24px; background: white; box-shadow: 0 18px 50px rgba(15, 35, 65, .12); border: 1px solid rgba(116, 137, 160, .18); }
    img { display: block; width: 100%; height: auto; border-radius: 16px; background: #d8e1eb; }
    figcaption { padding: 14px 6px 4px; }
    figcaption strong { display: block; font-size: 18px; margin-bottom: 5px; }
    figcaption span { color: #5a6b7c; line-height: 1.45; }
    code { background: #e6edf5; padding: 2px 6px; border-radius: 7px; }
  </style>
</head>
<body>
  <main>
    <h1>Carphacom Vultr Marketplace Gallery</h1>
    <p class="lead">Upload only the polished <code>800x500</code> PNG files below. The first image is the real main design from <code>demo.qubitpage.com</code>. The admin image is Carphacom's own Back Office / Admin Panel, not Vultr Cockpit.</p>
    <div class="grid">
      <figure>
        <img src="01-carphacom-platform-storefront-800x500.png" alt="Carphacom Platform Storefront" />
        <figcaption><strong>1. Carphacom Platform Storefront</strong><span>Main demo design from demo.qubitpage.com with localized commerce storefront.</span></figcaption>
      </figure>
      <figure>
        <img src="02-carphacom-back-office-admin-800x500.png" alt="Carphacom Back Office Admin Panel" />
        <figcaption><strong>2. Carphacom Back Office / Admin Panel</strong><span>Carphacom admin for catalog, orders, customers, regions, and operations.</span></figcaption>
      </figure>
      <figure>
        <img src="03-made-with-carphacom-statiiinfotrafic-800x500.png" alt="Made with Carphacom Statii Info Trafic" />
        <figcaption><strong>3. Made with Carphacom: Statii Info Trafic</strong><span>Example public site using Carphacom storefront/content patterns.</span></figcaption>
      </figure>
      <figure>
        <img src="04-made-with-carphacom-banat-tractor-800x500.png" alt="Made with Carphacom Banat Tractor" />
        <figcaption><strong>4. Made with Carphacom: Banat Tractor</strong><span>Industrial commerce example built with Carphacom workflows.</span></figcaption>
      </figure>
      <figure>
        <img src="05-carphacom-platform-routes-800x500.png" alt="Carphacom Developer Routes" />
        <figcaption><strong>5. Carphacom Developer Routes</strong><span>Developer Edition includes storefront, admin, Medusa API, warehouse, and digital-twin routes.</span></figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
