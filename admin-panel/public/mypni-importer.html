<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyPNI Importer - Selectare Produse</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1400px; margin: 0 auto; }
    
    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      color: #60a5fa;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin: 30px 0;
    }
    
    .stat-card {
      background: rgba(30, 41, 59, 0.8);
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }
    
    .stat-card:hover {
      border-color: #60a5fa;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(96, 165, 250, 0.1);
    }
    
    .stat-label {
      font-size: 0.9em;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    
    .stat-value {
      font-size: 2em;
      font-weight: bold;
      color: #60a5fa;
    }
    
    .categories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    
    .category-card {
      background: rgba(30, 41, 59, 0.9);
      border: 2px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s;
      backdrop-filter: blur(10px);
    }
    
    .category-card:hover {
      border-color: #60a5fa;
      box-shadow: 0 12px 30px rgba(96, 165, 250, 0.15);
      transform: translateY(-4px);
    }
    
    .category-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
      padding: 16px;
      border-bottom: 2px solid #334155;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    
    .category-title {
      font-weight: bold;
      font-size: 1.1em;
      color: #93c5fd;
    }
    
    .category-count {
      background: #1e3a8a;
      color: #93c5fd;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: bold;
    }
    
    .category-body {
      max-height: 400px;
      overflow-y: auto;
      padding: 12px;
    }
    
    .product-item {
      padding: 10px;
      margin-bottom: 8px;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 8px;
      border-left: 3px solid #60a5fa;
      transition: all 0.2s;
      cursor: pointer;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    
    .product-item:hover {
      background: rgba(15, 23, 42, 0.8);
      transform: translateX(4px);
    }
    
    .product-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 2px;
      accent-color: #60a5fa;
    }
    
    .product-info {
      flex: 1;
      min-width: 0;
    }
    
    .product-name {
      font-weight: 600;
      color: #e2e8f0;
      word-break: break-word;
      font-size: 0.95em;
    }
    
    .product-meta {
      font-size: 0.8em;
      color: #94a3b8;
      margin-top: 4px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    
    .meta-item {
      display: flex;
      gap: 4px;
    }
    
    .meta-label {
      color: #64748b;
    }
    
    .controls {
      position: sticky;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, transparent, rgba(15, 23, 42, 0.95));
      padding: 20px;
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 30px;
      flex-wrap: wrap;
    }
    
    button {
      padding: 12px 28px;
      font-size: 1em;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .btn-select-all {
      background: #3b82f6;
      color: white;
    }
    
    .btn-select-all:hover:not(:disabled) {
      background: #1d4ed8;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
    }
    
    .btn-import {
      background: #10b981;
      color: white;
      flex: 1;
      min-width: 200px;
    }
    
    .btn-import:hover:not(:disabled) {
      background: #059669;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }
    
    .btn-import:disabled {
      background: #475569;
      cursor: not-allowed;
      opacity: 0.5;
    }
    
    .selected-info {
      background: rgba(16, 185, 129, 0.1);
      border: 2px solid #10b981;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      font-size: 1.1em;
      font-weight: bold;
      color: #86efac;
      margin-bottom: 20px;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      font-size: 1.2em;
      color: #94a3b8;
    }
    
    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid rgba(96, 165, 250, 0.2);
      border-top: 4px solid #60a5fa;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 15px;
      vertical-align: middle;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .message {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 4px solid;
      animation: slideIn 0.3s ease;
    }
    
    .message.success {
      background: rgba(16, 185, 129, 0.1);
      border-color: #10b981;
      color: #86efac;
    }
    
    .message.error {
      background: rgba(239, 68, 68, 0.1);
      border-color: #ef4444;
      color: #fca5a5;
    }
    
    @keyframes slideIn {
      from { transform: translateY(-10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    @media (max-width: 768px) {
      .categories-grid {
        grid-template-columns: 1fr;
      }
      h1 { font-size: 1.8em; }
      .product-meta { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛒 MyPNI Product Importer</h1>
    <p style="color: #94a3b8; margin-bottom: 20px;">
      Selectează produsele pe care vrei să le imporți în catalog
    </p>
    
    <div id="message-container"></div>
    
    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Total Produse</div>
        <div class="stat-value" id="total-products">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Categorii</div>
        <div class="stat-value" id="total-categories">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Selectate</div>
        <div class="stat-value" id="selected-count">0</div>
      </div>
    </div>
    
    <div id="loading" class="loading">
      <div class="spinner"></div>
      Încarcă produse de la MyPNI...
    </div>
    
    <div id="content" style="display: none;">
      <div class="selected-info">
        Produse selectate: <span id="selected-display">0</span>
      </div>
      
      <div class="categories-grid" id="categories-container"></div>
      
      <div class="controls">
        <button class="btn-select-all" onclick="selectAll()">Selectează Tot</button>
        <button class="btn-select-all" onclick="deselectAll()" style="background: #ef4444;">Deselectează Tot</button>
        <button class="btn-import" id="import-btn" onclick="importProducts()" disabled>
          📥 Importă <span id="import-count">0</span> Produse
        </button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = '/app/api/suppliers/mypni/import-products';
    let selectedProducts = new Set();
    let allProducts = {};
    let categoryData = {};

    async function loadProducts() {
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'fetch-products' })
        });
        
        const data = await response.json();
        if (!data.success) throw new Error('API failed');
        
        categoryData = data.categories;
        
        // Build product index
        let totalProducts = 0;
        data.categories.forEach(cat => {
          allProducts[cat.name] = [];
          cat.products.forEach((prod, idx) => {
            const productId = prod.id;
            allProducts[cat.name].push(productId);
            totalProducts++;
          });
        });
        
        document.getElementById('total-products').textContent = data.categories
          .reduce((sum, c) => sum + c.product_count, 0);
        document.getElementById('total-categories').textContent = data.categories.length;
        
        renderCategories(data.categories);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
      } catch (error) {
        showMessage('Error loading products: ' + error.message, 'error');
      }
    }

    function renderCategories(categories) {
      const container = document.getElementById('categories-container');
      container.innerHTML = categories.map(cat => `
        <div class="category-card">
          <div class="category-header" onclick="toggleCategory('${cat.name}')">
            <div>
              <div class="category-title">${cat.name}</div>
              <small style="color: #64748b; margin-top: 4px; display: block;">MyPNI ID: ${cat.category_id}</small>
            </div>
            <div class="category-count">${cat.product_count}</div>
          </div>
          <div class="category-body" id="cat-${cat.name.replace(/\s+/g, '_')}">
            ${cat.products.map(prod => `
              <div class="product-item" onclick="toggleProduct(event, ${prod.id})">
                <input type="checkbox" value="${prod.id}" class="product-checkbox" id="prod-${prod.id}">
                <div class="product-info">
                  <div class="product-name">${prod.name}</div>
                  <div class="product-meta">
                    <div class="meta-item"><span class="meta-label">SKU:</span> ${prod.sku}</div>
                    <div class="meta-item"><span class="meta-label">Stoc:</span> ${prod.stock}</div>
                    <div class="meta-item"><span class="meta-label">Preț:</span> ${prod.price.retail} RON</div>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function toggleProduct(e, productId) {
      if (e.target.type === 'checkbox') return;
      const checkbox = document.getElementById(`prod-${productId}`);
      checkbox.checked = !checkbox.checked;
      updateSelection();
    }

    function toggleCategory(categoryName) {
      const key = categoryName.replace(/\s+/g, '_');
      const body = document.getElementById(`cat-${key}`);
      body.style.display = body.style.display === 'none' ? 'block' : 'none';
    }

    function updateSelection() {
      selectedProducts.clear();
      document.querySelectorAll('.product-checkbox:checked').forEach(cb => {
        selectedProducts.add(parseInt(cb.value));
      });
      
      document.getElementById('selected-count').textContent = selectedProducts.size;
      document.getElementById('selected-display').textContent = selectedProducts.size;
      document.getElementById('import-count').textContent = selectedProducts.size;
      document.getElementById('import-btn').disabled = selectedProducts.size === 0;
    }

    function selectAll() {
      document.querySelectorAll('.product-checkbox').forEach(cb => cb.checked = true);
      updateSelection();
    }

    function deselectAll() {
      document.querySelectorAll('.product-checkbox').forEach(cb => cb.checked = false);
      updateSelection();
    }

    async function importProducts() {
      if (selectedProducts.size === 0) {
        showMessage('Selectează cel puțin un produs', 'error');
        return;
      }

      const btn = document.getElementById('import-btn');
      btn.disabled = true;
      btn.textContent = '⏳ Se importă...';

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'import-products',
            productIds: Array.from(selectedProducts)
          })
        });

        const data = await response.json();
        if (data.success) {
          showMessage(`✅ Importate ${data.imported} produse cu succes!`, 'success');
          deselectAll();
          // Refresh after delay
          setTimeout(loadProducts, 2000);
        } else {
          showMessage(`Eroare la import: ${data.error}`, 'error');
        }
      } catch (error) {
        showMessage(`Eroare: ${error.message}`, 'error');
      } finally {
        btn.disabled = selectedProducts.size === 0;
        btn.textContent = `📥 Importă ${selectedProducts.size} Produse`;
      }
    }

    function showMessage(text, type) {
      const container = document.getElementById('message-container');
      const msg = document.createElement('div');
      msg.className = `message ${type}`;
      msg.textContent = text;
      container.appendChild(msg);
      setTimeout(() => msg.remove(), 5000);
    }

    loadProducts();
  </script>
</body>
</html>
